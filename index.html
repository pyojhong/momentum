<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomadcoder 강의</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h2 id="clock">00:00</h2>
    <form id="login-form" class="hidden">
        <input type="text" required maxlength="15" minlength="2" placeholder="Name?">
        <input type="submit" value="Log In">
    </form>
    <h1 id="greeting" class="hidden"></h1>
    <form id="todo-form">
        <input type="text" placeholder="할 일을 작성해주세요." required>
    </form>
    <ul id="todo-list"></ul>
    <div id="quote">
        <span></span>
        <span></span>
    </div>
    <script src="javascript/greetings.js"></script>
    <script src="javascript/clock.js"></script>
    <script src="javascript/quotes.js"></script>
    <script src="javascript/background.js"></script>
    <script src="javascript/todo.js"></script>
</body>
</html>
